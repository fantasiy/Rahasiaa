<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayu ❤️ Liza - Alay Dewa</title>
    <style>
        /* =================== RESET & BASE =================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fdfcfb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
            animation: bgShift 10s ease infinite;
            background-size: 400% 400%;
        }

        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =================== CANVAS (PARTIKEL HATI) =================== */
        #heartCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* =================== KONTEN UTAMA =================== */
        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px 25px;
            box-shadow: 0 20px 60px rgba(255, 20, 80, 0.3), 0 0 0 5px rgba(255, 255, 255, 0.5) inset;
            text-align: center;
            transition: all 0.3s ease;
            animation: floatContainer 4s ease-in-out infinite;
        }

        @keyframes floatContainer {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-15px) rotate(1deg); }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #ff2e63;
            text-shadow: 0 0 10px #ff2e63, 0 0 20px #ff2e63, 0 0 40px #ff2e63, 0 0 80px #ff2e63;
            animation: neonPulse 1.5s ease-in-out infinite alternate;
            margin-bottom: 10px;
        }

        @keyframes neonPulse {
            from { text-shadow: 0 0 10px #ff2e63, 0 0 20px #ff2e63, 0 0 40px #ff2e63; }
            to { text-shadow: 0 0 20px #ff2e63, 0 0 40px #ff2e63, 0 0 80px #ff2e63, 0 0 120px #ff2e63; }
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a10035;
            font-weight: bold;
            margin-bottom: 25px;
            animation: blinkText 1.8s step-start infinite;
        }

        @keyframes blinkText {
            50% { opacity: 0.3; }
        }

        /* =================== COUNTDOWN =================== */
        .countdown {
            background: rgba(255, 46, 99, 0.1);
            border-radius: 20px;
            padding: 15px;
            margin: 20px 0;
            border: 2px dashed #ff2e63;
        }
        .countdown h2 {
            color: #c4003a;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }
        #timer {
            font-size: 2rem;
            font-weight: bold;
            color: #ff2e63;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 46, 99, 0.5);
        }

        /* =================== LOVE METER =================== */
        .love-meter {
            background: rgba(255, 200, 220, 0.3);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
        }
        .love-meter h2 {
            color: #8b0040;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }
        .meter {
            width: 100%;
            height: 30px;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #ff2e63;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .fill {
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, #ff9a9e, #ff2e63, #ff5e8a);
            border-radius: 20px;
            transition: width 0.5s ease;
            position: relative;
        }
        .fill::after {
            content: "❤️";
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }
        .love-meter button {
            margin: 5px 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1rem;
        }
        #addLove {
            background: #ff2e63;
            color: white;
            box-shadow: 0 4px 15px rgba(255,46,99,0.4);
        }
        #addLove:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255,46,99,0.6);
        }
        #resetLove {
            background: #ddd;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #resetLove:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0,0,0,0.2);
        }

        /* =================== QUOTES =================== */
        .quotes {
            background: rgba(255, 230, 240, 0.6);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
        }
        .quotes h2 {
            color: #c4003a;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        #quoteText {
            font-size: 1.1rem;
            color: #5e001e;
            font-style: italic;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: white;
            border-radius: 15px;
            margin-bottom: 10px;
            box-shadow: 0 3px 10px rgba(255,46,99,0.1);
        }
        #newQuote {
            background: #ffb6c1;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            color: #a10035;
            transition: all 0.3s;
        }
        #newQuote:hover {
            background: #ff2e63;
            color: white;
            transform: rotate(-3deg) scale(1.05);
        }

        /* =================== BUTTONS =================== */
        #surpriseBtn, #loveBtn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 10px 8px;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        #surpriseBtn {
            background: #333;
            color: #fff;
            box-shadow: 0 5px 0 #000;
            animation: shakeBtn 1s infinite;
        }
        #surpriseBtn:hover {
            background: #ff0000;
            box-shadow: 0 5px 0 #990000;
            transform: translateY(-3px);
        }
        #loveBtn {
            background: #ff2e63;
            color: white;
            box-shadow: 0 5px 0 #b30035;
            animation: pulseBtn 1.5s infinite;
        }
        #loveBtn:hover {
            background: #ff5e8a;
            box-shadow: 0 5px 0 #b30035;
            transform: translateY(-3px);
        }
        @keyframes shakeBtn {
            0%,100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }
        @keyframes pulseBtn {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,46,99,0.7); }
            50% { box-shadow: 0 0 0 15px rgba(255,46,99,0); }
        }

        #messageArea {
            margin-top: 20px;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff2e63;
            min-height: 40px;
            background: rgba(255,255,255,0.5);
            border-radius: 15px;
            transition: all 0.3s;
        }

        footer {
            margin-top: 30px;
            color: #a10035;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(255,46,99,0.3);
        }

        /* =================== RESPONSIVE =================== */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .subtitle { font-size: 0.9rem; }
            #timer { font-size: 1.4rem; }
            .container { padding: 20px 15px; }
        }
    </style>
</head>
<body>
    <!-- Kanvas untuk partikel hati jatuh -->
    <canvas id="heartCanvas"></canvas>

    <!-- Konten utama -->
    <div class="container">
        <h1>BAYU ❤️ LIZA</h1>
        <p class="subtitle">😭✨ Pasangan Paling Kalem & Manis Sejagat Raya ✨😭</p>

        <!-- Countdown menuju anniversary -->
        <div class="countdown">
            <h2>💞 Menuju Anniversary 26 Juli 2026 💞</h2>
            <div id="timer">Menghitung...</div>
        </div>

        <!-- Love meter interaktif -->
        <div class="love-meter">
            <h2>💘 Love Meter Bayu ke Liza 💘</h2>
            <div class="meter">
                <div class="fill" id="loveFill" style="width: 80%;"></div>
            </div>
            <button id="addLove">Tambah Cinta 💖</button>
            <button id="resetLove">Reset Cinta 💔</button>
        </div>

        <!-- Quotes alay -->
        <div class="quotes">
            <h2>📜 Quotes Alay Pilihan 📜</h2>
            <p id="quoteText">Klik tombol untuk ganti quotes alay!</p>
            <button id="newQuote">Ganti Quotes 🔄</button>
        </div>

        <!-- Tombol kejutan -->
        <button id="surpriseBtn">Jangan Pencet! 😱</button>
        <button id="loveBtn">Klik untuk Cinta 💘</button>

        <!-- Area pesan dinamis -->
        <div id="messageArea"></div>

        <!-- Footer -->
        <footer>🦖 Dibuat dengan alay oleh Liza Admin Grup 🦖</footer>
    </div>

    <script>
        // =================== PARTIKEL HATI (CANVAS) ===================
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];
        const maxHearts = 100;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Heart {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 20 + 10;
                this.speedY = Math.random() * 2 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.6 + 0.4;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.color = ['#ff2e63','#ff5e8a','#ff9a9e','#ffb6c1','#ff477e','#ff0a54'][Math.floor(Math.random()*6)];
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;
                if (this.y > canvas.height + this.size) {
                    this.y = -this.size;
                    this.x = Math.random() * canvas.width;
                }
                if (this.x > canvas.width + this.size) this.x = -this.size;
                if (this.x < -this.size) this.x = canvas.width + this.size;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                // Gambar hati sederhana
                ctx.beginPath();
                ctx.moveTo(0, this.size * 0.3);
                ctx.bezierCurveTo(-this.size, -this.size * 0.5, -this.size * 0.5, this.size * 1.2, 0, this.size * 1.5);
                ctx.bezierCurveTo(this.size * 0.5, this.size * 1.2, this.size, -this.size * 0.5, 0, this.size * 0.3);
                ctx.fill();
                ctx.restore();
            }
        }

        function initHearts() {
            hearts = [];
            for (let i = 0; i < maxHearts; i++) {
                hearts.push(new Heart());
            }
        }
        initHearts();

        function animateHearts() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach(heart => {
                heart.update();
                heart.draw();
            });
            requestAnimationFrame(animateHearts);
        }
        animateHearts();

        // =================== COUNTDOWN ===================
        const targetDate = new Date('2026-07-26T00:00:00'); // 26 Juli 2026
        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;
            if (diff <= 0) {
                document.getElementById('timer').innerHTML = "🎉 HARI INI ANNIVERSARY! 🎉";
                return;
            }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById('timer').innerHTML = `${days} Hari ${hours} Jam ${minutes} Menit ${seconds} Detik`;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // =================== LOVE METER ===================
        let lovePercent = 80; // Default 80% karena cinta Bayu ke Liza sudah tinggi
        const loveFill = document.getElementById('loveFill');
        const messageArea = document.getElementById('messageArea');

        function updateLoveMeter() {
            loveFill.style.width = lovePercent + '%';
            if (lovePercent >= 100) {
                messageArea.innerHTML = '😭💖 LOVE METER OVERFLOW! BAYU CINTA MATI SAMA LIZA! 💖😭';
            } else if (lovePercent >= 80) {
                messageArea.innerHTML = '😍 Love Bayu ke Liza sudah sangat tinggi!';
            } else if (lovePercent >= 50) {
                messageArea.innerHTML = '😊 Love Bayu ke Liza lumayan!';
            } else {
                messageArea.innerHTML = '😢 Love Bayu ke Liza menurun, kasih tambah cinta!';
            }
        }

        document.getElementById('addLove').addEventListener('click', () => {
            if (lovePercent < 100) {
                lovePercent += 5;
                if (lovePercent > 100) lovePercent = 100;
                updateLoveMeter();
                // Efek getar kecil
                loveFill.style.transform = 'scale(1.05)';
                setTimeout(() => { loveFill.style.transform = 'scale(1)'; }, 100);
            } else {
                messageArea.innerHTML = '😭❤️ SUDAH MAKSIMAL! BAYU CINTA BANGET SAMA LIZA! ❤️😭';
            }
        });

        document.getElementById('resetLove').addEventListener('click', () => {
            lovePercent = 0;
            updateLoveMeter();
            messageArea.innerHTML = '💔 Love meter direset! Tapi Bayu pasti tetap cinta Liza kok.';
        });

        // =================== QUOTES ALAY ===================
        const quotes = [
            '😭 "Kamu tuh kayak wifi, makin deket makin kenceng sinyal cintanya" 😭',
            '💖 "Aku rela jadi bodoh asal kamu yang pinter, biar kita saling melengkapi" 💖',
            '😝 "Liza tuh manisnya kebangetan, sampe semut aja mundur" 😝',
            '😎 "Bayu tuh cool, tapi kalo liat Liza langsung meleleh kayak es krim" 😎',
            '😭 "Kita tuh jodoh, udah takdir, udah digaris tangan, udah diatur semesta" 😭',
            '💞 "Cinta kita tuh kayak rumus matematika, rumit tapi indah" 💞',
            '😜 "Kamu tuh alay, aku juga alay, kita alay bareng selamanya" 😜',
            '❤️ "Bayu + Liza = Bencana lucu yang bikin iri satu dunia" ❤️',
            '😭 "Aku cinta kamu, kamu cinta aku, kita saling cinta, udah gitu aja" 😭',
            '🦖 "Rwrrrr... itu artinya aku sayang kamu dalam bahasa dinosaurus" 🦖',
            '💘 "Kalo kamu nanya seberapa besar cintaku, jawabannya: lebih besar dari utang negara" 💘',
            '😍 "Liza tuh cantik, Bayu tuh ganteng, kita pasangan paling pas sedunia" 😍'
        ];

        const quoteText = document.getElementById('quoteText');
        const newQuoteBtn = document.getElementById('newQuote');

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            return quotes[randomIndex];
        }

        newQuoteBtn.addEventListener('click', () => {
            quoteText.style.opacity = '0';
            setTimeout(() => {
                quoteText.textContent = getRandomQuote();
                quoteText.style.opacity = '1';
            }, 300);
        });
        // Set quotes awal
        quoteText.textContent = quotes[0];

        // =================== TOMBOL KEJUTAN ===================
        const surpriseBtn = document.getElementById('surpriseBtn');
        surpriseBtn.addEventListener('click', () => {
            // Efek confetti sederhana dengan alert alay
            alert('😱 KOK DIPENCET SIH! KAMU PENCET TOMBOL TERLARANG!\n\n' +
                  'Tapi gapapa, karena kamu sudah terlanjur pencet, ' +
                  'maka secara resmi kamu dinyatakan CINTA BANGET sama Bayu & Liza! 😭❤️\n\n' +
                  'Sekarang kamu harus bilang: "BAYU & LIZA PALING LUCU SEDUNIA!" 🦖');
            messageArea.innerHTML = '😭💖 Kamu sudah kena jebakan cinta alay! 💖😭';
        });

        // =================== TOMBOL CINTA ===================
        const loveBtn = document.getElementById('loveBtn');
        let clickCount = 0;
        const loveMessages = [
            '💘 Cinta kamu bertambah!',
            '💖 Bayu & Liza makin sayang kamu!',
            '😍 Kamu sekarang official fans alay!',
            '💞 Cinta kamu ke pasangan ini makin dalam!',
            '😭 Cinta kamu ke Bayu & Liza OVERLOAD!',
            '🦖 Kamu sudah menjadi bagian dari keluarga alay!',
            '💘 Bayu & Liza mengirim virtual hug!',
            '❤️ Love meter kamu pribadi juga naik!',
            '😝 Kamu makin alay dari sebelumnya!',
            '💖 CINTA KAMU SUDAH DIAMBANG BATAS!'
        ];
        loveBtn.addEventListener('click', () => {
            clickCount++;
            const msg = loveMessages[clickCount % loveMessages.length];
            messageArea.innerHTML = msg + ` (Klik ke-${clickCount})`;
            // Efek tambahan: tambah love meter sedikit setiap klik
            if (lovePercent < 100) {
                lovePercent += 1;
                if (lovePercent > 100) lovePercent = 100;
                updateLoveMeter();
            }
        });

        // =================== INISIALISASI AWAL ===================
        updateLoveMeter();
    </script>
</body>
              </html>
